<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Next-CHF Management Console</title>
  <link rel="stylesheet" href="/static/vendor/pico.min.css" />
  <style>
    :root {
      --pico-font-size: 93.75%;
    }
    nav.top-bar {
      background: var(--pico-primary-background);
      color: var(--pico-primary-inverse);
      padding: .75rem 1.5rem;
      display: flex; align-items: center; gap: 1rem;
    }
    nav.top-bar h1 { font-size: 1.15rem; margin: 0; color: inherit; }
    nav.top-bar .live-badge {
      background: #2ecc71; color: #fff;
      border-radius: 4px; padding: 2px 8px;
      font-size: .65rem; font-weight: 700; text-transform: uppercase;
    }
    nav.top-bar .ts { margin-left: auto; font-size: .78rem; opacity: .7; }

    /* KPI cards */
    .kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: .75rem;
    }
    .kpi-card {
      background: var(--pico-card-background-color);
      border: 1px solid var(--pico-muted-border-color);
      border-radius: var(--pico-border-radius);
      padding: .9rem 1rem;
    }
    .kpi-card .label {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .06em;
      color: var(--pico-muted-color); margin-bottom: .3rem;
    }
    .kpi-card .value { font-size: 1.4rem; font-weight: 700; }
    .kpi-card .unit  { font-size: .75rem; color: var(--pico-muted-color); }

    /* Memory bar */
    .mem-bar { height: 8px; background: var(--pico-muted-border-color); border-radius: 4px; overflow: hidden; margin-top: .5rem; }
    .mem-bar-fill { height: 100%; background: var(--pico-primary); border-radius: 4px; transition: width .4s; }
    .mem-legend { font-size: .78rem; color: var(--pico-muted-color); margin-top: .3rem; }

    /* Tags */
    .tag {
      display: inline-block; padding: 2px 8px; border-radius: 12px;
      font-size: .7rem; font-weight: 600;
    }
    .tag-active    { background: #d1fae5; color: #065f46; }
    .tag-online    { background: #dbeafe; color: #1e40af; }
    .tag-offline   { background: #fef3c7; color: #92400e; }
    .tag-converged { background: #ede9fe; color: #5b21b6; }

    /* Session chips */
    .session-chip {
      display: inline-block;
      background: #e0e7ff; color: #3730a3;
      border-radius: 4px; padding: 4px 10px;
      font-size: .78rem; font-family: monospace;
      cursor: pointer; transition: background .15s;
    }
    .session-chip:hover { background: #c7d2fe; }

    /* Two-column layout */
    .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 1.5rem; }
    @media (max-width: 900px) { .grid-2 { grid-template-columns: 1fr; } }

    /* Sub detail cards */
    .sub-detail { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: .75rem; }
    .sub-field {
      background: var(--pico-card-sectioning-background-color);
      border-radius: var(--pico-border-radius); padding: .6rem .9rem;
    }
    .sub-field .flabel {
      font-size: .7rem; text-transform: uppercase; letter-spacing: .05em;
      color: var(--pico-muted-color); margin-bottom: .25rem;
    }
    .sub-field .fvalue { font-size: .88rem; font-weight: 600; word-break: break-all; }

    /* Utility */
    .muted { color: var(--pico-muted-color); font-size: .85rem; }
    .htmx-indicator { display: none; }
    .htmx-request .htmx-indicator { display: inline; }
    details > summary { cursor: pointer; font-weight: 600; }
  </style>
</head>
<body>

<nav class="top-bar">
  <h1>Next-CHF Management Console</h1>
  <span class="live-badge">Live</span>
  <span class="ts" id="last-refresh"></span>
</nav>

<main class="container-fluid" style="padding: 1.5rem;">

  <!-- ============================================================ -->
  <!-- System Status                                                 -->
  <!-- ============================================================ -->
  <article>
    <header>System Status</header>
    <div id="dashboard-content"
         hx-get="/api/dashboard"
         hx-trigger="load, every 5s"
         hx-swap="innerHTML">
      <p class="muted" aria-busy="true">Loading dashboard&hellip;</p>
    </div>
  </article>

  <div class="grid-2">

    <!-- Active Sessions -->
    <article>
      <header>Active Sessions</header>
      <div id="sessions-content"
           hx-get="/api/sessions"
           hx-trigger="load, every 5s"
           hx-swap="innerHTML">
        <p class="muted" aria-busy="true">Loading&hellip;</p>
      </div>
    </article>

    <!-- DIAMETER Status -->
    <article>
      <header>DIAMETER Status</header>
      <div id="diameter-content">
        <!-- filled by dashboard template -->
        <p class="muted">Waiting for data&hellip;</p>
      </div>
    </article>

  </div>

  <!-- ============================================================ -->
  <!-- CDR Browser                                                   -->
  <!-- ============================================================ -->
  <article>
    <header>CDR Browser</header>
    <form id="cdr-form" onsubmit="return loadCdrs(event)">
      <fieldset role="group">
        <input type="text" name="imsi" placeholder="Filter by IMSI" />
        <select name="type">
          <option value="">All types</option>
          <option value="online">online</option>
          <option value="offline">offline</option>
          <option value="converged">converged</option>
        </select>
        <input type="number" name="limit" placeholder="Limit" value="50" style="max-width:100px;" />
        <button type="submit">Fetch CDRs</button>
      </fieldset>
    </form>
    <div id="cdr-results">
      <p class="muted">Use the filter above to load CDRs.</p>
    </div>
  </article>

  <!-- ============================================================ -->
  <!-- Subscriber Management                                         -->
  <!-- ============================================================ -->
  <article>
    <header>Subscriber Management</header>

    <!-- Lookup -->
    <form id="sub-lookup-form" onsubmit="return lookupSubscriber(event)">
      <fieldset role="group">
        <input type="text" name="imsi" placeholder="IMSI" required />
        <button type="submit">Look Up</button>
      </fieldset>
    </form>
    <div id="sub-detail"></div>

    <!-- Create -->
    <details style="margin-top: 1.5rem;">
      <summary>Create New Subscriber</summary>
      <form id="sub-create-form" onsubmit="return createSubscriber(event)" style="margin-top: 1rem;">
        <div class="grid">
          <input type="text" name="imsi" placeholder="IMSI *" required />
          <input type="text" name="msisdn" placeholder="MSISDN *" required />
          <input type="text" name="account_id" placeholder="Account ID *" required />
        </div>
        <button type="submit" style="width: auto;">Create</button>
      </form>
      <div id="create-result"></div>
    </details>
  </article>

</main>

<script src="/static/vendor/htmx.min.js"></script>
<script>
// ================================================================
// Tiny client-side template helpers
// ================================================================
function fmtBytes(b) {
  if (b >= 1073741824) return (b / 1073741824).toFixed(1) + ' GB';
  if (b >= 1048576)    return (b / 1048576).toFixed(1) + ' MB';
  if (b >= 1024)       return (b / 1024).toFixed(1) + ' KB';
  return b + ' B';
}
function fmtUptime(s) {
  const d = Math.floor(s / 86400), h = Math.floor((s % 86400) / 3600),
        m = Math.floor((s % 3600) / 60), sec = s % 60;
  if (d > 0) return d + 'd ' + h + 'h ' + m + 'm';
  if (h > 0) return h + 'h ' + m + 'm ' + sec + 's';
  return m + 'm ' + sec + 's';
}
function typeTag(t) {
  const cls = {online:'tag-online', offline:'tag-offline', converged:'tag-converged'};
  return '<span class="tag ' + (cls[t]||'') + '">' + t + '</span>';
}
function statusTag(s) {
  const cls = {active:'tag-active', suspended:'tag-offline', terminated:'tag-offline'};
  return '<span class="tag ' + (cls[s]||'') + '">' + s + '</span>';
}
function el(id) { return document.getElementById(id); }

// ================================================================
// HTMX beforeSwap: intercept JSON responses and render templates
// ================================================================
document.body.addEventListener('htmx:beforeSwap', function(evt) {
  const xhr = evt.detail.xhr;
  const ct = xhr.getResponseHeader('content-type') || '';
  if (!ct.includes('application/json')) return;

  const targetId = evt.detail.target.id;
  let data;
  try { data = JSON.parse(xhr.responseText); } catch(e) { return; }

  if (targetId === 'dashboard-content') {
    evt.detail.serverResponse = renderDashboard(data);
  } else if (targetId === 'sessions-content') {
    evt.detail.serverResponse = renderSessions(data);
  }
});

// ================================================================
// Dashboard template
// ================================================================
function renderDashboard(d) {
  const totalMb = (d.memory.total / 1048576).toFixed(1);
  const procPct = d.memory.total > 0
    ? Math.round(d.memory.processes / d.memory.total * 100) : 0;

  // Update timestamp in nav
  el('last-refresh').textContent = 'Updated ' + new Date().toLocaleTimeString();

  // Update diameter card (separate target, not part of this swap)
  const svcs = (d.diameter.services || []).join(', ') || '(none)';
  el('diameter-content').innerHTML =
    '<div class="kpi-grid">' +
      '<div class="kpi-card"><div class="label">Services</div><div class="value" style="font-size:.9rem">' + svcs + '</div></div>' +
      '<div class="kpi-card"><div class="label">Peers</div><div class="value">' + d.diameter.peers + '</div></div>' +
    '</div>';

  return '' +
    '<div class="kpi-grid">' +
      '<div class="kpi-card"><div class="label">Node</div><div class="value" style="font-size:.9rem">' + (d.node||'?') + '</div></div>' +
      '<div class="kpi-card"><div class="label">Uptime</div><div class="value">' + fmtUptime(d.uptime||0) + '</div></div>' +
      '<div class="kpi-card"><div class="label">Processes</div><div class="value">' + d.processes.count + '<span class="unit"> / ' + d.processes.limit + '</span></div></div>' +
      '<div class="kpi-card"><div class="label">Active Sessions</div><div class="value">' + d.sessions.active + '</div></div>' +
      '<div class="kpi-card"><div class="label">DIAMETER Peers</div><div class="value">' + d.diameter.peers + '</div></div>' +
      '<div class="kpi-card"><div class="label">Memory</div><div class="value">' + totalMb + '<span class="unit"> MB</span></div></div>' +
    '</div>' +
    '<div class="mem-bar"><div class="mem-bar-fill" style="width:' + procPct + '%"></div></div>' +
    '<div class="mem-legend">processes ' + fmtBytes(d.memory.processes) +
      ' &middot; ets ' + fmtBytes(d.memory.ets) +
      ' &middot; binary ' + fmtBytes(d.memory.binary) + '</div>';
}

// ================================================================
// Sessions template
// ================================================================
function renderSessions(d) {
  const ids = d.session_ids || [];
  const count = '<p style="margin-bottom:.75rem"><strong>' + ids.length + '</strong> active session(s)</p>';
  if (ids.length === 0) return count + '<p class="muted">No active sessions</p>';
  const chips = ids.map(function(id) {
    return '<span class="session-chip" onclick="viewSession(\'' + id + '\')">' + id + '</span>';
  }).join(' ');
  return count + '<div>' + chips + '</div>';
}

// ================================================================
// Session detail (click on chip)
// ================================================================
function viewSession(id) {
  fetch('/api/sessions/' + encodeURIComponent(id))
    .then(function(r) { return r.json(); })
    .then(function(d) {
      var msg = 'Session: ' + d.session_id + '\n' +
                'IMSI: ' + d.imsi + '\n' +
                'Type: ' + d.type + '\n' +
                'State: ' + d.state + '\n' +
                'Granted: ' + JSON.stringify(d.granted_units) + '\n' +
                'Used: ' + JSON.stringify(d.used_units);
      alert(msg);
    })
    .catch(function(e) { alert('Error: ' + e.message); });
}

// ================================================================
// CDR browser (form submit)
// ================================================================
function loadCdrs(evt) {
  evt.preventDefault();
  var form = el('cdr-form');
  var params = new URLSearchParams();
  var imsi  = form.imsi.value.trim();
  var type  = form.type.value;
  var limit = form.limit.value.trim();
  if (imsi)  params.set('imsi', imsi);
  if (type)  params.set('type', type);
  if (limit) params.set('limit', limit);
  var wrap = el('cdr-results');
  wrap.innerHTML = '<p class="muted" aria-busy="true">Loading&hellip;</p>';

  fetch('/api/cdrs?' + params.toString())
    .then(function(r) { return r.json(); })
    .then(function(cdrs) {
      if (!cdrs.length) {
        wrap.innerHTML = '<p class="muted">No CDRs match the filter.</p>';
        return;
      }
      var rows = cdrs.map(function(c) {
        return '<tr>' +
          '<td><code>' + c.id + '</code></td>' +
          '<td>' + c.imsi + '</td>' +
          '<td>' + typeTag(c.type) + '</td>' +
          '<td>' + c.rating_group + '</td>' +
          '<td>' + (c.used_units ? JSON.stringify(c.used_units) : '—') + '</td>' +
          '<td>' + (c.timestamp ? new Date(c.timestamp).toLocaleString() : '—') + '</td>' +
        '</tr>';
      }).join('');
      wrap.innerHTML =
        '<figure><table role="grid">' +
          '<thead><tr><th>CDR ID</th><th>IMSI</th><th>Type</th><th>RG</th><th>Used Units</th><th>Timestamp</th></tr></thead>' +
          '<tbody>' + rows + '</tbody>' +
        '</table></figure>';
    })
    .catch(function(e) {
      wrap.innerHTML = '<p class="muted" style="color:var(--pico-del-color)">Failed: ' + e.message + '</p>';
    });
  return false;
}

// ================================================================
// Subscriber lookup (form submit)
// ================================================================
function lookupSubscriber(evt) {
  evt.preventDefault();
  var imsi = el('sub-lookup-form').imsi.value.trim();
  var wrap = el('sub-detail');
  if (!imsi) { wrap.innerHTML = '<p class="muted" style="color:var(--pico-del-color)">Enter an IMSI.</p>'; return false; }
  wrap.innerHTML = '<p class="muted" aria-busy="true">Looking up&hellip;</p>';

  fetch('/api/subscribers/' + encodeURIComponent(imsi))
    .then(function(r) {
      if (r.status === 404) { wrap.innerHTML = '<p class="muted" style="color:var(--pico-del-color)">Subscriber not found.</p>'; throw null; }
      return r.json();
    })
    .then(function(s) {
      if (!s) return;
      var bal = '';
      if (s.balance) {
        bal =
          '<div class="sub-field"><div class="flabel">Balance (available)</div><div class="fvalue">' + (s.balance.available / 1e6).toFixed(2) + ' units</div></div>' +
          '<div class="sub-field"><div class="flabel">Reserved</div><div class="fvalue">' + (s.balance.reserved / 1e6).toFixed(2) + ' units</div></div>';
      }
      wrap.innerHTML =
        '<div class="sub-detail">' +
          '<div class="sub-field"><div class="flabel">IMSI</div><div class="fvalue">' + s.imsi + '</div></div>' +
          '<div class="sub-field"><div class="flabel">MSISDN</div><div class="fvalue">' + s.msisdn + '</div></div>' +
          '<div class="sub-field"><div class="flabel">Account ID</div><div class="fvalue">' + s.account_id + '</div></div>' +
          '<div class="sub-field"><div class="flabel">Status</div><div class="fvalue">' + statusTag(s.status) + '</div></div>' +
          bal +
          '<div class="sub-field"><div class="flabel">Created</div><div class="fvalue">' + new Date(s.created_at).toLocaleString() + '</div></div>' +
          '<div class="sub-field"><div class="flabel">Updated</div><div class="fvalue">' + new Date(s.updated_at).toLocaleString() + '</div></div>' +
        '</div>';
    })
    .catch(function(e) {
      if (e) wrap.innerHTML = '<p class="muted" style="color:var(--pico-del-color)">Error: ' + e.message + '</p>';
    });
  return false;
}

// ================================================================
// Subscriber create (form submit)
// ================================================================
function createSubscriber(evt) {
  evt.preventDefault();
  var form = el('sub-create-form');
  var body = {
    imsi:       form.imsi.value.trim(),
    msisdn:     form.msisdn.value.trim(),
    account_id: form.account_id.value.trim()
  };
  var wrap = el('create-result');

  fetch('/api/subscribers', {
    method: 'POST',
    headers: {'Content-Type': 'application/json'},
    body: JSON.stringify(body)
  })
  .then(function(r) { return r.json().then(function(d) { return {ok: r.ok, data: d}; }); })
  .then(function(res) {
    if (res.ok) {
      wrap.innerHTML = '<p style="color:var(--pico-ins-color)">Subscriber ' + (res.data.imsi || body.imsi) + ' created.</p>';
      form.reset();
    } else {
      wrap.innerHTML = '<p style="color:var(--pico-del-color)">Error: ' + (res.data.error || JSON.stringify(res.data)) + '</p>';
    }
  })
  .catch(function(e) {
    wrap.innerHTML = '<p style="color:var(--pico-del-color)">Request failed: ' + e.message + '</p>';
  });
  return false;
}
</script>
</body>
</html>
