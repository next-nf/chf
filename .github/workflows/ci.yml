name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# Least privilege.
permissions:
  contents: read

# Cancel superseded runs on the same ref.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      # Pinned to commit SHAs (supply-chain hardening); version in trailing comment.
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - uses: erlef/setup-beam@fc68ffb90438ef2936bbb3251622353b3dcb2f93 # v1.24.0
        with:
          otp-version: '29'
          rebar3-version: '3.26.0'

      # Cache the rebar3 cache + _build. The cache key includes rebar.config
      # because the OpenTelemetry deps are pinned by git branch (next-nf forks),
      # so there is no rebar.lock hash to key on for those — a rebar.config edit
      # (e.g. moving a fork pin to a tag) must bust the cache.
      - name: Cache rebar3 cache and _build
        uses: actions/cache@27d5ce7f107fe9357f9df03efb73ab90386fccae # v5.0.5
        with:
          path: |
            ~/.cache/rebar3
            _build
          key: ${{ runner.os }}-otp29-${{ hashFiles('rebar.config', 'rebar.lock') }}
          restore-keys: |
            ${{ runner.os }}-otp29-

      # `rebar3 compile` runs the chf_diameter gen_dict.sh pre_hook, which
      # regenerates the Diameter codecs from dia/ with OTP's diameter_make
      # (they are gitignored, not checked in). The next-nf OpenTelemetry forks
      # are public, so `get-deps` needs no token beyond the default checkout.
      - name: Compile
        run: rebar3 compile

      # Single-node MongoDB replica set for the chf_db_mongo backend suite. The
      # gated chf_db_mongo_SUITE connects to 127.0.0.1:27017 (its defaults) and
      # runs; without a reachable Mongo it would skip, so starting it here is
      # what makes the Mongo backend covered in CI. Podman ships on ubuntu-latest
      # (the project uses podman, not docker). A replica set is required because
      # session_transaction uses multi-document transactions.
      - name: Start MongoDB replica set
        run: |
          podman run -d --name mongo -p 27017:27017 docker.io/library/mongo:7 --replSet rs0
          for i in $(seq 1 30); do podman exec mongo mongosh --quiet --eval 'db.runCommand({ping:1}).ok' && break; sleep 1; done
          podman exec mongo mongosh --quiet --eval 'rs.initiate({_id:"rs0",members:[{_id:0,host:"127.0.0.1:27017"}]})'
          for i in $(seq 1 30); do [ "$(podman exec mongo mongosh --quiet --eval 'rs.status().ok')" = "1" ] && break; sleep 1; done

      - name: Common Test
        run: rebar3 ct

      # The tree is warning-clean (mnesia/diameter/ranch are in plt_extra_apps;
      # the few remaining experimental-OTEL-API + Mnesia-match-spec warnings are
      # suppressed at the function level with explanatory -dialyzer attributes).
      # The PLT is cached via _build above, so steady-state runs are fast.
      - name: Dialyzer
        run: rebar3 dialyzer

      # GitHub bills artifacts by uncompressed size; upload one pre-compressed tarball.
      - name: Package CT logs on failure
        if: failure()
        run: |
          if [ -d _build/test/logs ]; then
            tar -cJf ct-logs.tar.xz -C _build/test logs
          fi

      - name: Upload CT logs on failure
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ct-logs
          path: ct-logs.tar.xz
          if-no-files-found: ignore
